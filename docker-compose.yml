services:
  pmhq:
    image: linyuchen/pmhq:7.3.2
    privileged: true
    environment:
      - ENABLE_HEADLESS=false
    networks:
      - app_network
    volumes:
      - qq_volume:/root/.config/QQ
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:13000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  llbot:
    image: linyuchen/llbot:7.11.0
    ports:
      - "3080:3080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PMHQ_HOST=pmhq
      - WEBUI_PORT=3080
    networks:
      - app_network
    volumes:
      - qq_volume:/root/.config/QQ
      - ./llbot_config:/app/llbot/data:rw
      - ./KirikoBot/carside_picture:/app/carside_picture
      - ./KirikoBot/stickers:/app/stickers
    depends_on:
      - pmhq
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sh", "-c", "ps | grep '[n]ode'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  my-robot:
    build:
      context: ./KirikoBot
      dockerfile: Dockerfile
    container_name: kiriko_robot
    command: ["waitress-serve", "--host=0.0.0.0", "--port=5000", "--threads=16", "main:app"]
    ports:
      - "5000:5000"
    env_file:
      - ./KirikoBot/.env
    volumes:
      - ./KirikoBot:/app
      # Read-only: lets the dashboard bridge authenticate against the
      # LLBot WebUI using the password in llbot_config/webui_token.txt
      - ./llbot_config:/app/llbot_config:ro
    networks:
      - app_network
    restart: always
    environment:
      - TZ=Asia/Shanghai
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    healthcheck:
      # /healthz is exempt from dashboard auth. "/" now returns 401 without
      # credentials, which would mark the container unhealthy.
      test: ["CMD", "curl", "-fsS", "http://localhost:5000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  qq_volume:

networks:
  app_network:
    driver: bridge
