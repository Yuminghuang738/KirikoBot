name: CI

on:
  push:
    branches: [main]
  pull_request:

# 只读 checkout：CI 不需要写仓库。
permissions:
  contents: read

# 同一分支的新提交取消旧 run，省 runner 分钟。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: KirikoBot/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r KirikoBot/requirements-dev.txt

      - name: pip check
        run: pip check

      - name: Ruff (syntax / undefined names)
        run: python -m ruff check KirikoBot tests scripts

      - name: Syntax-check every module
        run: python -m compileall -q KirikoBot

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: KirikoBot/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r KirikoBot/requirements-dev.txt

      - name: Run tests with coverage gate
        run: >
          python -m pytest tests/ -q -p no:cacheprovider
          --cov=KirikoBot --cov-report=term-missing --cov-fail-under=65
